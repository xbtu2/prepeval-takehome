[project]
name = "prepeval"
version = "0.1.0"
description = "Liquid-handling plan reasoning eval (reagent prep + labware/well addressing) and small-model improvement demo"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
plr = [
  # PyLabRobot is the ground truth for labware facts and well addressing at data-generation time only.
  "pylabrobot @ git+https://github.com/PyLabRobot/pylabrobot@160bfe5dd4d8897834a11c088567192ffb379fbb",
]
gpu = [
  "torch>=2.4",
  "transformers>=4.51",
  "peft>=0.14",
  "trl>=0.19",
  "datasets>=3.0",
  "accelerate>=1.0",
  "matplotlib>=3.8",
]
dev = [
  "pytest>=8",
  "jupytext>=1.16",
  "nbformat>=5.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["prepeval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# torch backend: uv picks the wheel via UV_TORCH_BACKEND (auto = detect CUDA; cpu = CPU-only box).
# Colab ships its own CUDA torch and never installs this extra.
